  <!-- The mono runtime boots by firing a burst of fetch() calls for ~1000 wasm/js assets. Every
       response carries an SRI digest, so a single 5xx from a proxy or a dropped connection can
       never satisfy it — one flaky request means the boot aborts and the page sits on "starting
       .NET runtime…" forever. Retrying server errors costs nothing on the success path (only
       failures pay) and lets a cold boot survive an unreliable network. Requests carrying a body
       are passed through untouched, since such a body may not be replayable. -->
  <script>
    (() => {
      const realFetch = window.fetch.bind(window);

      // Files over GitHub's 100 MB-per-file limit ship as ordered fragments — <name>.p0.wasm,
      // <name>.p1.wasm, … — with the original name absent, and are stitched back together below so
      // the runtime receives exactly the bytes it asked for. Only _framework/osu.Game.Resources
      // needs this (~127 MB), and only because of that limit; nothing else about the build changes.
      //
      // Reassembly is byte-for-byte identical to the unsplit file. The runtime's SRI digest covers
      // the whole file rather than a fragment, so it cannot be applied to the individual requests
      // and is dropped here; the assembled total is checked against the expected byte count
      // instead, which catches truncation — the failure mode that actually occurs in practice.
      //
      // Both tables are rewritten by web/make-static-export.ps1. The name carries a content hash,
      // so they must be regenerated on every rebuild rather than edited by hand.
      const SPLIT_FILES = {"osu.Game.Resources.8h29z1dy49.wasm":["osu.Game.Resources.8h29z1dy49.p0.wasm","osu.Game.Resources.8h29z1dy49.p1.wasm"]};
      const SPLIT_LENGTHS = {"osu.Game.Resources.8h29z1dy49.wasm":132945177};

      // Boot progress.
      //
      // The longest single phase of startup is `dotnet.create()` in main.js, which pulls the whole
      // WebAssembly payload through this wrapper. On a slow connection that is minutes of silence,
      // which reads as a hang rather than a download — so count what actually arrives here, where
      // every _framework response is already visible.
      //
      // Bytes are counted as the response body is read rather than from its content-length: the
      // length of a compressed response describes what crossed the network, while BOOT_TOTAL below
      // is the size of the payload once decoded. Counting decoded bytes keeps numerator and
      // denominator in the same units whether or not the host gzips the answer, and reports only
      // progress the runtime has actually got round to consuming.
      //
      // BOOT_TOTAL is the byte total of the root-level assemblies in _framework/ — the payload a
      // boot really downloads — written by web/make-static-export.ps1. Culture-localised
      // satellites (fetched only under a non-English UI), the dotnet.*.js entry points (loaded as
      // <script>, never fetched) and the ICU data files .NET declines to use all ship in the
      // bundle but are not part of a boot, so counting them would cap the bar short of full. A
      // plain `dotnet publish` leaves the value 0, meaning "unknown": main.js then reports bytes
      // and file counts without claiming a percentage it cannot know.
      const BOOT_TOTAL_BYTES = /*BOOT_TOTAL*/269474434;

      const bootProgress = {
        bytes: 0,
        files: 0,
        failed: 0,
        inflight: 0,
        total: BOOT_TOTAL_BYTES,
      };

      window.__boot = bootProgress;

      // Wrap a body so its bytes are counted as the consumer reads them. A file the runtime never
      // gets round to reading is therefore never counted either, which is what a progress bar
      // should say.
      const countBody = (response) => {
        if (!response.body || typeof response.body.pipeThrough !== 'function') return response;

        const counter = new TransformStream({
          transform(chunk, controller) {
            bootProgress.bytes += chunk.byteLength;
            controller.enqueue(chunk);
          },
          // Fully consumed, so one logical download has arrived.
          flush() { bootProgress.files++; },
        });

        return new Response(response.body.pipeThrough(counter), {
          status: response.status,
          statusText: response.statusText,
          headers: response.headers,
        });
      };

      const noteFrameworkDone = (ok) => {
        bootProgress.inflight = Math.max(0, bootProgress.inflight - 1);
        if (!ok) bootProgress.failed++;
      };

      // Two separate problems, one wrapper.
      //
      // 1. Concurrency. The runtime opens a fetch for every asset at once — ~1000 requests,
      //    ~130 MB — and that burst reliably gets 502s back rather than streaming through.
      //    Capping how many are in flight turns it into a steady trickle the server can serve.
      // 2. Retries. The runtime passes `integrity` on these fetches, so a 502 (empty body)
      //    makes the fetch *reject* on a digest mismatch instead of returning a 502 response —
      //    and one bad asset aborts the entire boot. Retrying recovers; only failures pay.
      const MAX_IN_FLIGHT = 6;
      let inFlight = 0;
      const waiters = [];

      const acquire = () => inFlight < MAX_IN_FLIGHT
        ? (inFlight++, Promise.resolve())
        : new Promise(r => waiters.push(r));

      const release = () => {
        const next = waiters.shift();
        if (next) next();
        else inFlight--;
      };

      // Retries on 5xx (and only on failures — the success path pays nothing), so a burst of
      // ~1000 asset requests survives a proxy that folds under it. `input` is passed through
      // untouched for ordinary requests so anything carried on a Request — integrity included —
      // still reaches the network.
      const fetchWithRetry = async (input, init, url) => {
        let lastError;
        for (let attempt = 0; attempt < 8; attempt++) {
          if (attempt) await new Promise(r => setTimeout(r, Math.min(1500, 200 * attempt)));
          await acquire();
          try {
            const response = await realFetch(input, init);
            if (response.status < 500) return response;
            lastError = new Error(`HTTP ${response.status} for ${url}`);
          } catch (e) {
            lastError = e;
          } finally {
            release();
          }
        }
        throw lastError;
      };

      // Stitches one oversized file's fragments back into a single Response.
      //
      // Every fragment is requested and status-checked first — with the retries above — so a
      // missing or failing fragment surfaces as an ordinary HTTP error the runtime can see, before
      // a single byte is handed over. The bodies are then read one at a time, so only one fragment
      // is resident at once rather than all of them plus a concatenated copy: at ~63 MB per
      // fragment that is the difference between ~126 MB and ~250 MB of peak JS memory.
      const reassemble = async (url, init) => {
        const dir = url.slice(0, url.lastIndexOf('/') + 1);
        const name = url.slice(dir.length);
        const fragments = SPLIT_FILES[name];
        const expected = SPLIT_LENGTHS[name];

        const fragmentInit = init ? { ...init } : { method: 'GET' };
        delete fragmentInit.integrity;

        const responses = [];
        for (const fragment of fragments) {
          const fragmentUrl = dir + fragment;
          bootProgress.inflight++;
          try {
            const response = await fetchWithRetry(fragmentUrl, fragmentInit, fragmentUrl);
            if (!response.ok)
              throw new Error(`HTTP ${response.status} for ${fragmentUrl}`);

            responses.push(response);
          } finally {
            bootProgress.inflight = Math.max(0, bootProgress.inflight - 1);
          }
        }

        let seen = 0;
        const body = new ReadableStream({
          async start(controller) {
            try {
              for (const response of responses) {
                const reader = response.body.getReader();
                for (;;) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  seen += value.byteLength;
                  // Counted here rather than in the wrapper: these requests never pass through it,
                  // and at ~63 MB each the fragments are the bulk of the whole payload. Bytes are
                  // counted as they are read, so this stays in the same units as BOOT_TOTAL.
                  bootProgress.bytes += value.byteLength;
                  controller.enqueue(value);
                }
                bootProgress.files++;
              }
              if (expected != null && seen !== expected)
                throw new Error(`assembled ${seen} bytes for ${name}, expected ${expected}`);
              controller.close();
            } catch (e) {
              controller.error(e);
            }
          },
        });

        return new Response(body, {
          status: 200,
          headers: { 'Content-Type': 'application/wasm' },
        });
      };

      window.fetch = async (input, init) => {
        const url = String(input && input.url ? input.url : input);
        const hasBody = init && init.body != null;
        const framework = url.includes('/_framework/') && !hasBody;

        // reassemble() counts its own fragments as they land — that asset is 127 MB of the
        // payload and by far the slowest part, so it has to be accounted for where it is read.
        if (!hasBody && SPLIT_FILES[url.slice(url.lastIndexOf('/') + 1)])
          return reassemble(url, init);

        if (!framework) return realFetch(input, init);

        bootProgress.inflight++;
        try {
          const response = await fetchWithRetry(input, init, url);
          noteFrameworkDone(response.ok);
          return response.ok ? countBody(response) : response;
        } catch (e) {
          noteFrameworkDone(false);
          throw e;
        }
      };
    })();
  </script>
  <script type='module' src="main.5retw5w4eh.js"></script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <!-- Boot progress. A cold load pulls ~130 MB of WebAssembly, which takes long enough to read as
       a hang, so it gets a full-screen loading bar rather than a status line in the corner.
       main.js drives the label and the bar (setStatus) and takes the whole thing away once the
       game reports running. -->
  <div id="boot">
    <div class="boot-mark">osu!web</div>
    <div class="boot-box">
      <div id="status">booting…</div>
      <div id="boot-detail"></div>
      <div class="boot-track"><div id="boot-fill"></div></div>
    </div>
  </div>

  <!-- The gameplay host draws the playfield here; the shell sits over the top of it and hides
       itself when a play is running (see shell.js). -->

  <!-- Covers the gap between clicking Play and gameplay actually running. A cold load is long
       enough to read as a hang, so this reports real milestones (see shell.js) and shimmers
       in between rather than sitting frozen. Sits outside #shell so it can appear while the
       shell is hidden during gameplay (and again, briefly, on a restart). -->
  <div id="load-overlay" hidden>
    <div class="load-box">
      <div id="load-label">starting…</div>
      <div class="load-track"><div class="load-fill" id="load-fill"></div></div>
    </div>
  </div>

  <!-- "back to difficulties" for when lazer's own ResultsScreen is what's on the canvas. It has
       to live outside #shell, because re-showing the shell would cover the very screen it
       is meant to leave. -->
  <button id="game-back" hidden>← back to difficulties</button>

  <!-- The shell's own menu screen: a lazer-style song-select laid out over the beatmap's real
       background artwork (dimmed and blurred, like the gameplay background container does in
       canvas). Left panel shows the selected difficulty's details, the middle column is the
       scrollable list, the right column is the mod picker, and the top bar carries import,
       settings and Play. Drives the real gameplay host through window.osu (see shell.js). -->
  <div id="shell">
    <!-- Beatmap artwork behind everything. The <img> is only a loader: the actual backdrop is a
         CSS background on #shell-bg so dim/blur/position can be driven by CSS custom
         properties without repainting the element itself. -->
    <div id="shell-bg"></div>

    <header id="topbar">
      <div class="topbar-left">
        <span id="shell-title" class="title">osu!web</span>
        <label class="import">
          <input type="file" id="osz-file" accept=".osz,.zip" />
          <span>import .osz</span>
        </label>
        <span id="import-status" class="muted">choose a .osz to begin</span>
      </div>

      <div class="topbar-right">
        <button id="settings-button" type="button" title="settings">settings</button>
        <button id="play-button" class="play" disabled>play</button>
      </div>
    </header>

    <div id="layout">
      <!-- Selected difficulty's details, mirroring lazer's own info panel: title/artist/mapper,
           the star rating the real difficulty calculator reports for the current mod selection,
           the object breakdown, and the four difficulty settings osu! shows. -->
      <aside id="info" hidden>
        <div id="beatmap-info" class="beatmap-info"></div>
      </aside>

      <!-- Every difficulty in the set in one column, easiest first, each coloured by its own star
           rating — lazer's carousel when it is sorted by difficulty rather than grouped by band. -->
      <main id="list-pane">
        <div id="difficulty-list" class="difficulties" hidden></div>
        <div id="empty-note" class="empty">import a .osz to see its difficulties here</div>
      </main>

      <!-- The ruleset's own mod list, fetched from OsuRuleset.CreateAllMods() rather than copied
           out of it, so anything lazer gains or loses shows up here without a shell change.
           One column per ModType, laid out left to right and coloured the way lazer's mod select
           categorises them, each column scrolling its own mods; and each mod writes out its full
           name, description, score multiplier and ranked status, with any setting it exposes
           (DT's speed, flashlight's size, …) editable in place. -->
      <aside id="mods-pane">
        <div class="pane-heading">mods</div>
        <div id="mod-columns" class="columns"></div>

        <!-- What the current selection does to the map: the total score multiplier and whether the
             set still scores pp, then the resulting difficulty — the same numbers lazer's mod
             select previews before you commit to a play. -->
        <div id="mod-footer" class="mod-footer" hidden>
          <div class="mod-footer-line">
            <span id="mod-multiplier" class="mod-multiplier">1.00x</span>
            <span id="mod-ranked" class="mod-ranked ranked">ranked</span>
          </div>
          <div id="mod-preview" class="mod-preview"></div>
        </div>

        <div id="mod-note" class="muted"></div>
      </aside>
    </div>

    <!-- Shown in place of the difficulty list once a play has ended without reaching lazer's own
         results screen (a fail, or quitting out early). -->
    <div id="results" class="results" hidden></div>
  </div>

  <!-- Settings. Every control below writes to a real OsuConfigManager bindable (or, for the skin,
       to SkinManager.CurrentSkinInfo), so what is set here is what lazer's gameplay code reads.
       Grouped the way lazer's own settings overlay sections are: visual, audio, input, graphics. -->
  <div id="settings" hidden>
    <div class="settings-box">
      <div class="settings-heading">
        <span>settings</span>
        <button id="settings-close" type="button" title="close">×</button>
      </div>

      <div id="gameplay-settings"></div>

      <section class="settings-section">
        <div class="pane-heading">skin</div>
        <div class="row">
          <span id="skin-name" class="muted">—</span>
          <label class="import">
            <input type="file" id="osk-file" accept=".osk" />
            <span>import .osk</span>
          </label>
          <span id="skin-status" class="muted"></span>
        </div>
        <div class="row">
          <label><input type="checkbox" id="opt-volume" checked /> audio</label>
          <span id="settings-status" class="muted"></span>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="shell.x0pk7p6we7.js"></script>
</body>
</html>
